<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RESUMEN PAC</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 24px 30px;
    }

    header h1 {
        margin: 0 0 6px 0;
        font-size: 26px;
    }

    header p {
        margin: 0;
        color: #cbd5e1;
        font-size: 14px;
    }

    .barra {
        background: white;
        padding: 15px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    #buscador {
        flex: 1;
        min-width: 250px;
        max-width: 500px;
        padding: 11px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    #buscador:focus {
        border-color: #64748b;
    }

    button {
        padding: 11px 16px;
        border: none;
        border-radius: 7px;
        background: #374151;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #111827;
    }

    #estado {
        margin-left: auto;
        color: #64748b;
        font-size: 13px;
    }

    .contenedor {
        padding: 20px;
    }

    .tabla-contenedor {
        background: white;
        border-radius: 9px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        overflow: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1000px;
    }

    th {
        background: #374151;
        color: white;
        padding: 13px 12px;
        text-align: left;
        font-size: 13px;
        position: sticky;
        top: 0;
        z-index: 2;
        cursor: pointer;
        white-space: nowrap;
    }

    th:hover {
        background: #4b5563;
    }

    td {
        padding: 11px 12px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
        vertical-align: middle;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    .empresa {
        font-weight: bold;
        white-space: nowrap;
    }

    .porcentaje {
        font-weight: bold;
        text-align: center;
        min-width: 130px;
    }

    .porcentaje.alto {
        color: #166534;
        background: #dcfce7;
    }

    .porcentaje.medio {
        color: #854d0e;
        background: #fef9c3;
    }

    .porcentaje.bajo {
        color: #991b1b;
        background: #fee2e2;
    }

    .cantidad {
        text-align: center;
        font-weight: bold;
        min-width: 100px;
    }

    .vacio {
        text-align: center;
        padding: 40px;
        color: #64748b;
    }

    .pie {
        padding: 15px 5px;
        color: #64748b;
        font-size: 13px;
    }

    @media (max-width: 700px) {

        header {
            padding: 18px;
        }

        header h1 {
            font-size: 21px;
        }

        .barra {
            padding: 12px;
        }

        .contenedor {
            padding: 10px;
        }

        #estado {
            width: 100%;
            margin-left: 0;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Índice de Relevamientos</h1>
    <p>Información actualizada directamente desde Google Sheets</p>
</header>

<div class="barra">

    <input
        type="text"
        id="buscador"
        placeholder="Buscar empresa o detalle..."
        autocomplete="off"
    >

    <button onclick="cargarDatos()">
        🔄 Actualizar
    </button>

    <span id="estado">
        Cargando...
    </span>

</div>

<div class="contenedor">

    <div class="tabla-contenedor">

        <table>

            <thead>
                <tr>
                    <th onclick="ordenar(0)">EMPRESA ↕</th>
                    <th onclick="ordenar(1)">DETALLE ↕</th>
                    <th onclick="ordenar(2)">FECHA ÚLT. ENTREGA ↕</th>
                    <th onclick="ordenar(3)">FECHA DEVOLUCIÓN ↕</th>
                    <th onclick="ordenar(4)">% RELEVAMIENTOS COMPLETOS ↕</th>
                    <th onclick="ordenar(5)">C1 (Repetidos y Faltantes) ↕</th>
                    <th onclick="ordenar(6)">C2 (Datos claves -DN + Long.-) ↕</th>
                </tr>
            </thead>

            <tbody id="datos">
            </tbody>

        </table>

    </div>

    <div class="pie" id="contador">
        0 registros
    </div>

</div>


<script>

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const SHEET_ID = "1qezplpI3p2E5XcVCDq7E6q30fZtyyW3QR9LAxOkfMVg";

const GID = "0";


/*
   Columnas reales de Google Sheets:

   A = 0
   C = 2
   D = 3
   E = 4
   M = 12
   N = 13
   O = 14
*/

const COLUMNAS = [0, 2, 3, 4, 12, 13, 14];

let datosOriginales = [];

let datosMostrados = [];

let ordenActual = {
    columna: null,
    ascendente: true
};


/* ============================================================
   CARGAR GOOGLE SHEETS
   ============================================================ */

async function cargarDatos() {

    const estado = document.getElementById("estado");

    estado.textContent = "Cargando...";

    try {

        /*
           Se agrega un parámetro aleatorio para evitar que
           el navegador reutilice una versión anterior.
        */

        const cache = Date.now();

        const url =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&cache=${cache}`;


        const respuesta = await fetch(url);

        if (!respuesta.ok) {
            throw new Error("No se pudo acceder a Google Sheets");
        }

        const texto = await respuesta.text();


        /*
           Google devuelve:

           google.visualization.Query.setResponse({...})

           Por eso extraemos solamente el objeto JSON.
        */

        const inicio = texto.indexOf("{");

        const fin = texto.lastIndexOf("}");

        const json = JSON.parse(
            texto.substring(inicio, fin + 1)
        );


        const filas = json.table.rows;


        datosOriginales = filas.map(fila => {

            return COLUMNAS.map(indice => {

                const celda = fila.c[indice];

                if (!celda) {
                    return "";
                }

                return celda.f ??
                       celda.v ??
                       "";

            });

        });


        datosMostrados = [...datosOriginales];

        mostrarDatos(datosMostrados);

        estado.textContent =
            "Actualizado: " +
            new Date().toLocaleTimeString("es-AR");

    }
    catch (error) {

        console.error(error);

        estado.textContent =
            "Error al cargar los datos";

        document.getElementById("datos").innerHTML = `
            <tr>
                <td colspan="7" class="vacio">
                    No se pudo cargar la información desde Google Sheets.
                    <br><br>
                    Verificá que la planilla esté disponible para lectura.
                </td>
            </tr>
        `;
    }
}


/* ============================================================
   MOSTRAR DATOS
   ============================================================ */

function mostrarDatos(datos) {

    const cuerpo = document.getElementById("datos");

    if (datos.length === 0) {

        cuerpo.innerHTML = `
            <tr>
                <td colspan="7" class="vacio">
                    No se encontraron registros.
                </td>
            </tr>
        `;

        document.getElementById("contador").textContent =
            "0 registros";

        return;
    }


    cuerpo.innerHTML = datos.map(fila => {

        const porcentaje = convertirNumero(fila[4]);

        let clasePorcentaje = "";

        if (!isNaN(porcentaje)) {

            if (porcentaje >= 90) {
                clasePorcentaje = "alto";
            }
            else if (porcentaje >= 70) {
                clasePorcentaje = "medio";
            }
            else {
                clasePorcentaje = "bajo";
            }
        }


        return `
            <tr>

                <td class="empresa">
                    ${escaparHTML(fila[0])}
                </td>

                <td>
                    ${escaparHTML(fila[1])}
                </td>

                <td>
                    ${escaparHTML(fila[2])}
                </td>

                <td>
                    ${escaparHTML(fila[3])}
                </td>

                <td class="porcentaje ${clasePorcentaje}">
                    ${formatearPorcentaje(fila[4])}
                </td>

                <td class="cantidad">
                    ${escaparHTML(fila[5])}
                </td>

                <td class="cantidad">
                    ${escaparHTML(fila[6])}
                </td>

            </tr>
        `;

    }).join("");


    document.getElementById("contador").textContent =
        `${datos.length} registros`;
}


/* ============================================================
   BUSCADOR
   ============================================================ */

document.getElementById("buscador")
    .addEventListener("input", function() {

        const texto = this.value
            .toLowerCase()
            .trim();


        if (!texto) {

            datosMostrados = [...datosOriginales];

        }
        else {

            datosMostrados =
                datosOriginales.filter(fila => {

                    return fila.some(valor => {

                        return String(valor)
                            .toLowerCase()
                            .includes(texto);

                    });

                });

        }


        mostrarDatos(datosMostrados);
    });


/* ============================================================
   ORDENAMIENTO
   ============================================================ */

function ordenar(columna) {

    if (ordenActual.columna === columna) {

        ordenActual.ascendente =
            !ordenActual.ascendente;

    }
    else {

        ordenActual.columna = columna;

        ordenActual.ascendente = true;

    }


    datosMostrados.sort((a, b) => {

        let valorA = a[columna];
        let valorB = b[columna];


        const numeroA = convertirNumero(valorA);
        const numeroB = convertirNumero(valorB);


        if (!isNaN(numeroA) && !isNaN(numeroB)) {

            return ordenActual.ascendente
                ? numeroA - numeroB
                : numeroB - numeroA;

        }


        valorA = String(valorA).toLowerCase();
        valorB = String(valorB).toLowerCase();


        if (valorA < valorB) {
            return ordenActual.ascendente ? -1 : 1;
        }

        if (valorA > valorB) {
            return ordenActual.ascendente ? 1 : -1;
        }

        return 0;

    });


    mostrarDatos(datosMostrados);
}


/* ============================================================
   CONVERTIR NÚMEROS
   ============================================================ */

function convertirNumero(valor) {

    if (valor === null || valor === undefined) {
        return NaN;
    }

    let texto = String(valor)
        .replace("%", "")
        .replace(",", ".")
        .trim();

    const numero = parseFloat(texto);

    return numero;
}


/* ============================================================
   FORMATO PORCENTAJE
   ============================================================ */

function formatearPorcentaje(valor) {

    if (valor === "" || valor === null) {
        return "";
    }

    const numero = convertirNumero(valor);

    if (isNaN(numero)) {
        return escaparHTML(valor);
    }

    /*
       Si Google devuelve 0.95 lo mostramos como 95%.
       Si devuelve 95 lo mostramos como 95%.
    */

    if (numero > 0 && numero <= 1) {
        return (numero * 100).toFixed(1) + "%";
    }

    return numero.toFixed(1) + "%";
}


/* ============================================================
   SEGURIDAD HTML
   ============================================================ */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   INICIO
   ============================================================ */

cargarDatos();

</script>

</body>
</html>
```
